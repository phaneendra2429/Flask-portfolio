name: Deploy Flask Project to Render

# Step 1: Define the event that triggers the workflow
on:
  push:
    branches:
      - main   # Runs the workflow when code is pushed to the 'main' branch
  pull_request:
    branches:
      - main   # Also runs on pull requests targeting the 'main' branch

# Step 2: Define the jobs (build, test, deploy)
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 3: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 4: Set up Python environment to install dependencies and test the code
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Step 5: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 6: Run tests (optional step to verify that the project works)
      - name: Run tests
        run: |
          python -m unittest discover tests

      # Step 7: Log in to Docker Hub (replace with your Docker Hub credentials)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 8: Build the Docker image
      - name: Build Docker image
        run: docker build -t phaneendraganji/portfolio-flaskapp:latest .

      # Step 9: Push the Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push phaneendraganji/portfolio-flaskapp:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 10: Use Render's API to deploy the application
      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/deploy" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Accept: application/json" \
          -d '{"serviceId": "your-render-service-id"}'

