name: Deploy Flask Project to Render

# Step 1: Define the event that triggers the workflow
on:
  push:
    branches:
      - main   # Runs the workflow when code is pushed to the 'main' branch
  pull_request:
    branches:
      - main   # Also runs on pull requests targeting the 'main' branch

# Step 2: Define the jobs (build, test, deploy)
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 3: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 4: Set up Python environment to install dependencies and test the code
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Step 5: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 6: Run tests (optional step to verify that the project works)
      - name: Run tests
        run: |
          pytest

      build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./DockerFile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/flasktest-app:latest

    - name: Image digest
      run: echo ${{ steps.build-and-publish.outputs.digest }}

