name: CI — Test Flask Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Coolify handles building and deploying automatically via its
# GitHub integration webhook — no deploy step needed here.

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        pytest