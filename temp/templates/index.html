<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
    <!-- Include Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center">Recommendations</h1>
        <div id="recommendationCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner">
                {% for rec in recommendations|batch(2) %}
                <div class="carousel-item {% if loop.index == 1 %}active{% endif %}">
                    <div class="row">
                        {% for item in rec %}
                        <div class="col-md-6">
                            <div class="card mb-3 mx-auto" style="max-width: 800px;">
                                <div class="row g-0 align-items-center">
                                    <div class="col-md-4 text-center">
                                        <img src="{{ item.image }}" class="img-fluid rounded-circle" alt="{{ item.image }}" style="width: 150px; height: 150px;">
                                    </div>
                                    <div class="col-md-8">
                                        <div class="card-body">
                                            <h5 class="card-title">{{ item.name }}</h5>
                                            <h6 class="card-subtitle mb-2 text-muted">{{ item.title }}</h6>
                                            <p class="card-text">{{ item.recommendation }}</p>
                                            <p class="card-date"><small class="text-muted">{{ item.date }}</small></p>
                                            <a href="https://www.linkedin.com/in/phaneendra-g/details/recommendations/" target="_blank" class="read-more-link">Read more</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#recommendationCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#recommendationCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>

    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
