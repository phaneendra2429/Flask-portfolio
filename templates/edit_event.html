<!-- templates/edit_event.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Event</title>
  <link rel="stylesheet" href="../static/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <h2>Edit Event</h2>
  <form method="POST">
    <label for="title">Event Title</label>
    <input type="text" id="title" name="title" value="{{ event.title }}" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" required>{{ event.description }}</textarea>

    <label for="tags">Tags (comma separated)</label>
    <input type="text" id="tags" name="tags" value="{{ event.tags | join(', ') }}" required>

    <label for="mode">Mode</label>
    <select id="mode" name="mode" class="form-control" required>
    <option value="in_person" {% if event.mode == 'in_person' %}selected{% endif %}>In Person</option>
    <option value="online" {% if event.mode == 'online' %}selected{% endif %}>Online</option>
    </select>


    <label for="image_url">Image URL</label>
    <input type="url" id="image_url" name="image_url" value="{{ event.image_url }}" required>

    <label for="post_url">Post URL</label>
    <input type="url" id="post_url" name="post_url" value="{{ event.post_url }}" required>

    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{{ url_for('add_event') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
