<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Project</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <h1>Add a New Project</h1>
    <form method="POST" action="/add_project">
        <label for="title">Project Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="description">Project Description:</label>
        <textarea id="description" name="description" required></textarea><br><br>

        <label for="labels">Labels (comma separated):</label>
        <input type="text" id="labels" name="labels" required><br><br>

        <label for="image">Image Link (e.g., 200x200):</label>
        <input type="text" id="image" name="image" value="image">
        <select id="image-dropdown" onchange="document.getElementById('image').value = this.value;">
            <option value="">Select an image</option>
            <option value="https://i.ibb.co/94tt6BY/giphy.webp">Under Construction</option>
        </select><br><br>

        <label for="github">GitHub Link:</label>
        <input type="url" id="github" name="github" required><br><br>

        <button type="submit">Add Project</button>
    </form>

    <a href="/">Back to Projects</a>

    <div class="mb-4">
        <h2>Projects</h2>
        <div class="project-section">
            <div class="project-tags">
                <button class="project-tag" data-category="Gen AI">Gen AI</button>
                <button class="project-tag" data-category="ML">ML</button>
                <button class="project-tag" data-category="SQL">SQL</button>
                <button class="project-tag" data-category="Excel">Excel</button>
                <button class="project-tag" data-category="Tableau">Tableau</button>
                <button class="project-tag" data-category="AWS">AWS</button>
            </div>
            <div class="project-grid" id="projectGrid">
                {% for project in projects %}
<div class="project-card">
    <div class="project-image-placeholder">
        <img src="{{ project.image_placeholder }}" alt="{{ project.title }}" width="220" height="200">
    </div>
    <div class="project-info">
        <h3 style="font-weight: bold;">{{ project.title }}</h3>
        <p>{{ project.description }}</p>
        <div class="project-labels">
            {% for label in project.labels[1:] %}
            <span class="label">{{ label }}</span>
            {% endfor %}
        </div>
        <a href="{{ project.github }}" class="view-project-btn">View Project</a>
        <a href="{{ url_for('edit_project', project_index=loop.index0) }}" class="edit-project-btn">Edit</a>
    </div>
</div>
{% endfor %}
            </div>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const projectTags = document.querySelectorAll('.project-tag');
        
            projectTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    const category = tag.getAttribute('data-category');
        
                    fetch('/filter_projects', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ category }),
                    })
                    .then(response => response.json())
                    .then(data => {
                        const projectGrid = document.getElementById('projectGrid');
                        projectGrid.innerHTML = '';
        
                        data.forEach(project => {
                            const projectCard = `
                            <div class="project-card">
                                <div class="project-image-placeholder">
                                    <img src=${ project.image_placeholder } alt=${ project.title } width="220" height="200">
                                </div>
                                <div class="project-info">
                                    <h3 style="font-weight: bold;">${project.title}</h3>
                                    <p>${project.description}</p>
                                    <div class="project-labels">
                                        ${project.labels.slice(1).map(label => `<span class="label">${label}</span>`).join('')}
                                    </div>
                                    <a href="${ project.github }" class="view-project-btn">View Project</a>
                                </div>
                            </div>
                            `;
                            projectGrid.innerHTML += projectCard;
                        });
                    })
                    .catch(error => console.error('Error:', error));
                });
            });
        });
        </script>
</body>
</html>
