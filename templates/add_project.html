<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Project</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h1 class="text-center mb-4">Add a New Project</h1>
        <form method="POST" action="/add_project" class="border p-4 rounded bg-white shadow-sm">
            <div class="mb-3">
                <label for="title" class="form-label">Project Title</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Project Description</label>
                <textarea class="form-control" id="description" name="description" required></textarea>
            </div>

            <div class="mb-3">
                <label for="labels" class="form-label">Labels (comma separated)</label>
                <input type="text" class="form-control" id="labels" name="labels" required>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Image Link</label>
                <input type="text" class="form-control" id="image" name="image">
                <select class="form-select mt-2" onchange="document.getElementById('image').value = this.value;">
                    <option value="">-- Select Predefined Image --</option>
                    <option value="https://i.ibb.co/94tt6BY/giphy.webp">Under Construction Image</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="github" class="form-label">GitHub Link</label>
                <input type="url" class="form-control" id="github" name="github" required>
            </div>

            <button type="submit" class="btn btn-primary">Add Project</button>
        </form>

        <hr class="my-5">

        <h2 class="text-center mb-3">Existing Projects</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered table-hover align-middle text-center shadow-sm bg-white">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Labels</th>
                        <th>GitHub</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for project in projects %}
                    <tr>
                        <td>{{ project.title }}</td>
                        <td>{{ project.description }}</td>
                        <td>{{ project.labels | join(', ') }}</td>
                        <td><a href="{{ project.github }}" target="_blank">GitHub</a></td>
                        <td><a href="{{ url_for('edit_project', project_index=loop.index0) }}" class="btn btn-sm btn-outline-secondary">Edit</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-secondary">← Back to Home</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
