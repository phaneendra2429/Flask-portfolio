<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Certification</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center">Add New Certification</h1>
    <form action="{{ url_for('certifications.add_certification') }}" method="POST">
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
          <option value="professional">Professional</option>
          <option value="courses">Courses</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="title" class="form-label">Certificate Title</label>
        <input type="text" class="form-control" id="title" name="title" required />
      </div>
      <div class="mb-3">
        <label for="platform" class="form-label">Platform / Provider</label>
        <input type="text" class="form-control" id="platform" name="platform" required />
      </div>
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="text" class="form-control" id="date" name="date" required />
      </div>
      <div class="mb-3">
        <label for="image" class="form-label">Certificate Image URL</label>
        <input type="text" class="form-control" id="image" name="image" required />
      </div>
      <div class="mb-3">
        <label for="url" class="form-label">Verification URL</label>
        <input type="text" class="form-control" id="url" name="url" required />
      </div>
      <button type="submit" class="btn btn-primary">Add Certification</button>
    </form>
    <hr class="my-5" />
    <h3>Existing Certifications</h3>
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Platform</th>
          <th>Date</th>
          <th>Category</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for cert in certifications %}
        <tr>
          <td>{{ loop.index }}</td>
          <td>{{ cert.title }}</td>
          <td>{{ cert.platform }}</td>
          <td>{{ cert.date }}</td>
          <td>{{ cert._category }}</td>
          <td>
            <a href="{{ url_for('certifications.edit_certification', category=cert._category, index=cert._idx) }}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a href="{{ url_for('certifications.delete_certification', category=cert._category, index=cert._idx) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this certification?');">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="text-center mt-4">
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>
</body>
</html>
