<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-sidebar {
            min-height: 100vh;
            background: #212529;
            color: white;
            padding-top: 2rem;
        }

        .admin-sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            display: block;
        }

        .admin-sidebar a:hover {
            color: white;
            background: #343a40;
        }

        .admin-content {
            padding: 2rem;
            background: #f8f9fa;
            min-height: 100vh;
        }

        .stat-card {
            border-radius: 12px;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block admin-sidebar">
                <div class="position-sticky">
                    <h5 class="px-4 mb-4">Portfolio Admin</h5>
                    <a href="{{ url_for('admin.dashboard') }}"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
                    <a href="{{ url_for('projects.add_project') }}"><i class="fas fa-briefcase me-2"></i> Projects</a>
                    <a href="{{ url_for('events.add_event') }}"><i class="fas fa-calendar-alt me-2"></i> Events</a>
                    <a href="{{ url_for('skills.add_skill') }}"><i class="fas fa-code me-2"></i> Skills</a>
                    <a href="{{ url_for('certifications.add_certification') }}"><i class="fas fa-certificate me-2"></i>
                        Certs</a>
                    <a href="{{ url_for('recommend.add_recommendation') }}"><i class="fas fa-comment me-2"></i>
                        Recommends</a>
                    <hr class="mx-3">
                    <a href="{{ url_for('auth.logout') }}" class="text-danger"><i class="fas fa-sign-out-alt me-2"></i>
                        Logout</a>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto admin-content">
                <div
                    class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
                    <h1>Admin Dashboard</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary" target="_blank">View Site</a>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card stat-card p-4 text-center">
                            <i class="fas fa-briefcase fa-2x text-primary mb-2"></i>
                            <h5>Manage Projects</h5>
                            <a href="{{ url_for('projects.add_project') }}" class="btn btn-sm btn-primary mt-2">Go to
                                Projects</a>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card p-4 text-center">
                            <i class="fas fa-calendar-alt fa-2x text-success mb-2"></i>
                            <h5>Manage Events</h5>
                            <a href="{{ url_for('events.add_event') }}" class="btn btn-sm btn-success mt-2">Go to
                                Events</a>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card p-4 text-center">
                            <i class="fas fa-certificate fa-2x text-warning mb-2"></i>
                            <h5>Manage Certs</h5>
                            <a href="{{ url_for('certifications.add_certification') }}"
                                class="btn btn-sm btn-warning mt-2">Go to Certs</a>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card p-4 text-center">
                            <i class="fas fa-code fa-2x text-info mb-2"></i>
                            <h5>Manage Skills</h5>
                            <a href="{{ url_for('skills.add_skill') }}" class="btn btn-sm btn-info mt-2">Go to
                                Skills</a>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card p-4 text-center">
                            <i class="fas fa-comment fa-2x text-secondary mb-2"></i>
                            <h5>Manage Recommends</h5>
                            <a href="{{ url_for('recommend.add_recommendation') }}"
                                class="btn btn-sm btn-secondary mt-2">Go to Recommends</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
