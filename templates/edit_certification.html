<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Certification</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container { max-width: 800px; }
  </style>
  </head>
<body>
  <div class="container my-5">
    <h1 class="mb-4">Edit Certification</h1>
    <form method="POST">
      <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
          <option value="professional" {% if category == 'professional' %}selected{% endif %}>Professional</option>
          <option value="courses" {% if category == 'courses' %}selected{% endif %}>Courses</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="title" class="form-label">Certificate Title</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ certification.title }}" required />
      </div>
      <div class="mb-3">
        <label for="platform" class="form-label">Platform / Provider</label>
        <input type="text" class="form-control" id="platform" name="platform" value="{{ certification.platform }}" required />
      </div>
      <div class="mb-3">
        <label for="date" class="form-label">Date</label>
        <input type="text" class="form-control" id="date" name="date" value="{{ certification.date }}" required />
      </div>
      <div class="mb-3">
        <label for="image" class="form-label">Certificate Image URL</label>
        <input type="text" class="form-control" id="image" name="image" value="{{ certification.image }}" required />
      </div>
      <div class="mb-3">
        <label for="url" class="form-label">Verification URL</label>
        <input type="text" class="form-control" id="url" name="url" value="{{ certification.url }}" required />
      </div>
      <button type="submit" class="btn btn-success">Save Changes</button>
      <a href="{{ url_for('certifications.add_certification') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
